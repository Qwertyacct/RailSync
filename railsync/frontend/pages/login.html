<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – RailSync</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="nav" id="nav"></div>
<div class="container"><form class="card form-card" id="f">
  <h2>Login</h2><div id="msg"></div>
  <div class="field"><label>Email</label><input type="email" id="email" required></div>
  <div class="field"><label>Password</label><input type="password" id="password" required></div>
  <button type="submit">Login</button>
  <p>New here? <a href="/pages/register.html">Create an account</a></p>
</form></div>
<script src="/js/api.js"></script>
<script>
renderNav();
f.onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await api('/auth/login', { method: 'POST', body: { email: email.value, password: password.value } });
    Auth.save(r.token, r.user);
    location.href = r.user.role === 'ADMIN' ? '/pages/admin-dashboard.html' : '/index.html';
  } catch (err) { msg.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
};
</script></body></html>

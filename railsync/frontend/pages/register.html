<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register – RailSync</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="nav" id="nav"></div>
<div class="container"><form class="card form-card" id="f">
  <h2>Create account</h2><div id="msg"></div>
  <div class="field"><label>Full name</label><input id="full_name" required minlength="2"></div>
  <div class="field"><label>Email</label><input type="email" id="email" required></div>
  <div class="field"><label>Phone (10 digits)</label><input id="phone" required pattern="[0-9]{10}"></div>
  <div class="field"><label>Password (min 8 characters)</label><input type="password" id="password" required minlength="8"></div>
  <button type="submit">Register</button>
  <p>Already registered? <a href="/pages/login.html">Login</a></p>
</form></div>
<script src="/js/api.js"></script>
<script>
renderNav();
f.onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api('/auth/register', { method: 'POST',
      body: { full_name: full_name.value, email: email.value, phone: phone.value, password: password.value } });
    msg.innerHTML = '<div class="msg ok">Registered! Redirecting to login…</div>';
    setTimeout(() => (location.href = '/pages/login.html'), 1000);
  } catch (err) { msg.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
};
</script></body></html>
